# Ashtadhyayi Sutras Database (selected sutras)
#
# Every entry's adhyaya/pada/number is verified against the Aṣṭādhyāyī text
# shipped in the vidyut data bundle (see tests/test_data/test_sutra_citations.py).
# Text is the sutra as transmitted (SLP1 -> Devanagari); meanings are editorial.
# Do not add an entry whose number you have not checked against vidyut.

title: Aṣṭādhyāyī (अष्टाध्यायी)
author: Pāṇini (पाणिनि)
description: 'The Aṣṭādhyāyī is a Sanskrit treatise on grammar written in the 4th century BCE by the Indian
  grammarian Pāṇini. It is the foundational text of Vyākaraṇa (Sanskrit grammar) and consists of 3,959
  sutras (rules) organized into 8 chapters (adhyāyas) with 4 sections (pādas) each.

  '
structure:
  adhyayas: 8
  padas_per_adhyaya: 4
  total_padas: 32
  approximate_sutras: 3959
total_sutras: 3959
adhyayas:
  '1':
    title: प्रथमोऽध्यायः
    title_iast: Prathamo'dhyāyaḥ
    description: First chapter - Definitions and interpretive rules
    padas:
      '1':
      - number: 1
        text: वृद्धिरादैच्
        transliteration: vṛddhirādaic
        meaning: ā, ai, and au are called vṛddhi
        topic: definitions
      - number: 2
        text: अदेङ् गुणः
        transliteration: adeṅ guṇaḥ
        meaning: a, e, and o are called guṇa
        topic: definitions
      - number: 3
        text: इको गुणवृद्धी
        transliteration: iko guṇavṛddhī
        meaning: guṇa and vṛddhi replace ik vowels
        topic: operations
      - number: 4
        text: न धातुलोप आर्धधातुके
        transliteration: na dhātulopa ārdhadhātuke
        meaning: not when dhatu is elided before ārdhadhātuka
        topic: exceptions
      - number: 5
        text: क्ङिति च
        transliteration: kṅiti ca
        meaning: and when followed by k or ṅ-marked suffix
        topic: exceptions
      - number: 7
        text: हलोऽनन्तराः संयोगः
        transliteration: halo'nantarāḥ saṃyogaḥ
        meaning: consonants in immediate succession form a saṃyoga (cluster)
        topic: definitions
      - number: 21
        text: आद्यन्तवदेकस्मिन्
        transliteration: ādyantavadekasmin
        meaning: when applied to one, it is as if applied to the beginning or end
        topic: interpretation
      - number: 49
        text: षष्ठी स्थानेयोगा
        transliteration: ṣaṣṭhī sthāneyogā
        meaning: the genitive denotes 'in place of'
        topic: interpretation
      - number: 56
        text: स्थानिवदादेशोऽनल्विधौ
        transliteration: sthānivadādeśo'nalvidhau
        meaning: a substitute behaves like the original except for al (vowel) rules
        topic: interpretation
      - number: 60
        text: अदर्शनं लोपः
        transliteration: adarśanaṃ lopaḥ
        meaning: non-appearance (of a phoneme) is called lopa (elision)
        topic: definitions
      - number: 66
        text: तस्मिन्निति निर्दिष्टे पूर्वस्य
        transliteration: tasminniti nirdiṣṭe pūrvasya
        meaning: when 'in that' is stated, the operation applies to what precedes
        topic: interpretation
      '2':
      - number: 46
        text: कृत्तद्धितसमासाश्च
        transliteration: kṛttaddhitasamāsāśca
        meaning: and kṛt-derivatives, taddhita-derivatives, and compounds
        topic: definitions
      '3':
      - number: 1
        text: भूवादयो धातवः
        transliteration: bhūvādayo dhātavaḥ
        meaning: bhū and the rest are called dhātus (roots)
        topic: definitions
      - number: 9
        text: तस्य लोपः
        transliteration: tasya lopaḥ
        meaning: there is elision of that (which is marked for elision)
        topic: operations
      '4':
      - number: 1
        text: आ कडारादेका संज्ञा
        transliteration: ā kaḍārādekā saṃjñā
        meaning: from ā to ḍ, only one technical term applies (to a given element)
        topic: interpretation
      - number: 2
        text: विप्रतिषेधे परं कार्यम्
        transliteration: vipratiṣedhe paraṃ kāryam
        meaning: when there is mutual contradiction, the later rule prevails
        topic: interpretation
      - number: 13
        text: यस्मात् प्रत्ययविधिस्तदादि प्रत्ययेऽङ्गम्
        transliteration: yasmāt pratyayavidhistadādi pratyaye'ṅgam
        meaning: the element from which a suffix is prescribed, together with what precedes, is called
          aṅga before that suffix
        topic: definitions
      - number: 14
        text: सुप्तिङन्तं पदम्
        transliteration: suptiṅantaṃ padam
        meaning: that which ends in a sup or tiṅ suffix is called a pada (word)
        topic: definitions
      - number: 21
        text: बहुषु बहुवचनम्
        transliteration: bahuṣu bahuvacanam
        meaning: plural when many
        topic: number
      - number: 22
        text: द्व्येकयोर्द्विवचनैकवचने
        transliteration: dvyekayordvivacanaikavacane
        meaning: dual and singular for two and one respectively
        topic: number
  '2':
    title: द्वितीयोऽध्यायः
    title_iast: Dvitīyo'dhyāyaḥ
    description: Second chapter - Compounds and case relations
    padas:
      '1':
      - number: 1
        text: समर्थः पदविधिः
        transliteration: samarthaḥ padavidhiḥ
        meaning: rules about words apply when there is syntactic connection
        topic: compounds
      - number: 2
        text: सुबामन्त्रिते पराङ्गवत् स्वरे
        transliteration: subāmantrite parāṅgavat svare
        meaning: a sup ending after vocative is like a final aṅga in accent
        topic: compounds
      - number: 3
        text: प्राक् कडारात् समासः
        transliteration: prāk kaḍārāt samāsaḥ
        meaning: before the kaḍāra section, compounds (are prescribed)
        topic: compounds
      - number: 4
        text: सह सुपा
        transliteration: saha supā
        meaning: together with a case ending
        topic: compounds
      - number: 5
        text: अव्ययीभावः
        transliteration: avyayībhāvaḥ
        meaning: avyayībhāva (adverbial compound)
        topic: compounds
      '3':
      - number: 2
        text: कर्मणि द्वितीया
        transliteration: karmaṇi dvitīyā
        meaning: the accusative (is used) in relation to the object
        topic: case-relations
      - number: 13
        text: चतुर्थी सम्प्रदाने
        transliteration: caturthī sampradāne
        meaning: the dative (is used) in relation to the recipient
        topic: case-relations
      - number: 18
        text: कर्तृकरणयोस्तृतीया
        transliteration: kartṛkaraṇayostṛtīyā
        meaning: the instrumental (is used) in relation to agent and instrument
        topic: case-relations
      - number: 28
        text: अपादाने पञ्चमी
        transliteration: apādāne pañcamī
        meaning: the ablative (is used) in relation to source
        topic: case-relations
      - number: 46
        text: प्रातिपदिकार्थलिङ्गपरिमाणवचनमात्रे प्रथमा
        transliteration: prātipadikārthaliṅgaparimāṇavacanamātre prathamā
        meaning: the nominative expresses only the nominal stem's sense, gender, measure and number
        topic: case-relations
      - number: 50
        text: षष्ठी शेषे
        transliteration: ṣaṣṭhī śeṣe
        meaning: the genitive (is used) for the remaining relations (e.g. possession)
        topic: case-relations
  '3':
    title: तृतीयोऽध्यायः
    title_iast: Tṛtīyo'dhyāyaḥ
    description: Third chapter - Verbal and primary suffixes
    padas:
      '1':
      - number: 2
        text: परश्च
        transliteration: paraśca
        meaning: and the following (element)
        topic: interpretation
      - number: 91
        text: धातोः
        transliteration: dhātoḥ
        meaning: (suffixes are added) to a dhatu (governs 3.1.91-3.4.117)
        topic: derivation
  '5':
    title: पञ्चमोऽध्यायः
    title_iast: Pañcamo'dhyāyaḥ
    description: Fifth chapter - Secondary (taddhita) suffixes
    padas:
      '3':
      - number: 1
        text: प्राग्दिशो विभक्तिः
        transliteration: prāgdiśo vibhaktiḥ
        meaning: case-endings (are prescribed) before the direction section
        topic: case-endings
  '7':
    title: सप्तमोऽध्यायः
    title_iast: Saptamo'dhyāyaḥ
    description: Seventh chapter - Stem (aṅga) operations
    padas:
      '3':
      - number: 84
        text: सार्वधातुकार्धधातुकयोः
        transliteration: sārvadhātukārdhadhātukayoḥ
        meaning: (before) sārvadhātuka and ārdhadhātuka
        topic: derivation
