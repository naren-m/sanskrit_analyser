[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanskrit-analyzer"
version = "0.1.0"
description = "Sanskrit NLP library: Vidyut analysis, lexicon-anchored sandhi segmentation, chandas, ByT5/BGE-M3 embeddings, deep-read kosha"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naren Mudivarthy" }
]
keywords = ["sanskrit", "nlp", "parser", "linguistics", "sandhi", "dhatu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.0",
    "indic-transliteration>=2.3.0",
    "vidyut>=0.4.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.7",
]
cache = [
    "redis>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    "httpx>=0.25.0",
]

[project.scripts]
sanskrit-train = "sanskrit_analyzer.training.cli:main"

[project.urls]
Homepage = "https://github.com/narenmudivarthy/sanskrit-analyzer"
Documentation = "https://github.com/narenmudivarthy/sanskrit-analyzer#readme"
Repository = "https://github.com/narenmudivarthy/sanskrit-analyzer"

[tool.hatch.build.targets.wheel]
packages = ["sanskrit_analyzer"]
# CDSL Layer B TSVs (~20 MB). sanskrit_analyzer.lexicon reads them, but they stay
# out of the wheel on size; lexicon.resolve_data_dir() also looks at
# SANSKRIT_LAYERB_DIR and ~/.sanskrit_analyzer/vyutpatti, and lexicon.is_available()
# is False when none of those has the data. Drop this line to ship them instead.
# Vendored Aṣṭādhyāyī corpus (~69 MB): the wheel keeps only what SutraIndex
# reads (ashtadhyayi_data.CORE_FILES) plus the credit; the rest is checkout-only.
exclude = [
    "sanskrit_analyzer/data/vyutpatti/*.tsv",
    "sanskrit_analyzer/data/ashtadhyayi/**",
    "!sanskrit_analyzer/data/ashtadhyayi/SOURCE.md",
    "!sanskrit_analyzer/data/ashtadhyayi/manifest.json",
    "!sanskrit_analyzer/data/ashtadhyayi/sutraani/kashika.txt",
    "!sanskrit_analyzer/data/ashtadhyayi/sutraani/vasu_english_summary.txt",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
# NOTE: --strict-config cannot be set here. pytest validates ini keys while
# loading the ini file, so a flag coming *from* addopts arrives too late to
# govern that validation and `asyncio_mode` still degrades to a warning. The
# equivalent guard lives in conftest.py instead.
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that are slow and/or require ML model weights (deselect with '-m \"not slow\"')",
]

# Code-smell gate (naren-m/smell-lint v0.1.0). Baseline: .smell_baseline.json.
# Gates the whole repo: library, CLIs, tests, examples and scripts. No excludes.
[tool.smell_lint]
paths = ["."]
